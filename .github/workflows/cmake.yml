name: CI

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  build:
    # Dependencies (MRPT, GTSAM, mola_common) come from each distro's ROS apt
    # repository, so both GTSAM 4.2 (Boost) and >=4.3 (Boost-free) are covered.
    name: ROS 2 ${{ matrix.distro }}
    runs-on: ubuntu-latest
    container: ros:${{ matrix.distro }}-ros-base
    strategy:
      fail-fast: false
      matrix:
        distro: [ humble, jazzy, kilted, lyrical, rolling ]

    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v4
      with:
        path: src/gtsam2mrpt_serial

    - name: Install dependencies
      run: |
        apt-get update
        apt-get install -y python3-colcon-common-extensions
        rosdep update --rosdistro ${{ matrix.distro }}
        rosdep install --from-paths src --ignore-src -y --rosdistro ${{ matrix.distro }}

    - name: Build
      run: |
        source /opt/ros/${{ matrix.distro }}/setup.bash
        colcon build --event-handlers console_cohesion+ \
          --cmake-args -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

    - name: Test
      run: |
        source /opt/ros/${{ matrix.distro }}/setup.bash
        colcon test --event-handlers console_cohesion+
        colcon test-result --verbose
